# Single node kind cluster. The test images and results directory are mounted from the host so
# the load test Job can read real radiographs and write its measurements back out.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /opt/data/k8s
        containerPath: /data
