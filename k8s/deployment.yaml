apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier
  labels: {app: classifier}
spec:
  replicas: 1
  selector:
    matchLabels: {app: classifier}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below the current replica count during a rollout
      maxSurge: 1
  template:
    metadata:
      labels: {app: classifier}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: classifier
          image: classifier:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - {name: ORT_THREADS, value: "1"}
            - {name: MODEL_PATH, value: /models/model.onnx}
          resources:
            requests: {cpu: "1", memory: 600Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Keep serving while the endpoint removal propagates to kube-proxy, then let
              # uvicorn finish in flight requests on SIGTERM.
              exec: {command: ["sleep", "5"]}
---
apiVersion: v1
kind: Service
metadata:
  name: classifier
spec:
  selector: {app: classifier}
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: classifier
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: classifier}
